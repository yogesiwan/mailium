apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cache-runtime
  namespace: mailium
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cache-runtime
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
