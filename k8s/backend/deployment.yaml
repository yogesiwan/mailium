apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-runtime
  namespace: mailium
  labels:
    app: cache-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-runtime
  template:
    metadata:
      labels:
        app: cache-runtime
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: cache-runtime
          image: ghcr.io/yogesiwan/mailium-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5001"
          envFrom:
            - secretRef:
                name: mailium-backend-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
